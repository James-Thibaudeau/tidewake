<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tidewake gallery</title>
  <!-- Look-dev gallery: a page for looking at the game's art, not part of the
       game. See src/gallery/main.js. The import map must match index.html's
       (tools/check.mjs checks that it does). -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #141a28; font: 13px/1.4 system-ui, sans-serif; color: #e8edf7; }
    #view { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
    #bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
    #bar label { pointer-events: auto; display: flex; align-items: center; gap: 5px; padding: 3px 4px 3px 8px; border-radius: 6px; background: rgba(20, 26, 40, 0.78); }
    #bar select { font: inherit; color: inherit; background: #26304a; border: 1px solid #3b4868; border-radius: 4px; padding: 2px 4px; }
    #caption { position: fixed; left: 8px; bottom: 8px; max-width: 80vw; padding: 5px 9px; border-radius: 6px; background: rgba(20, 26, 40, 0.78); font-family: ui-monospace, Menlo, monospace; font-size: 12px; pointer-events: none; }
    #caption .warn { color: #ffb86b; }
    #sheet { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #0c111c; cursor: zoom-out; }
    .hidden { display: none; }
  </style>
  <script type="importmap">
  {"imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
    "postprocessing":"https://cdn.jsdelivr.net/npm/postprocessing@6.39.6/build/index.js",
    "three-custom-shader-material/vanilla":"https://cdn.jsdelivr.net/npm/three-custom-shader-material@6.4.0/vanilla/three-custom-shader-material.es.js"
  }}
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="bar"></div>
  <div id="caption">Loading…</div>
  <canvas id="sheet" class="hidden"></canvas>
  <script type="module" src="src/gallery/main.js"></script>
</body>
</html>
