<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Tidewake jukebox</title>
  <!-- The jukebox: a page for listening to the game's score, not part of the
       game. It is to the music what gallery.html is to the art. See
       src/music/jukebox.js. It loads no libraries, only the game's own sound. -->
  <style>
    html, body { margin: 0; min-height: 100%; background: #141a28; font: 14px/1.5 system-ui, sans-serif; color: #e8edf7; }
    main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #9fb0d0; margin: 22px 0 8px; }
    p { margin: 0 0 10px; color: #b9c4dc; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button { font: inherit; color: inherit; background: #26304a; border: 1px solid #3b4868; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
    button:hover { background: #303c5c; }
    button.on { background: #2f6f8f; border-color: #58a9cf; }
    button.big { padding: 10px 18px; font-size: 15px; }
    label { display: flex; align-items: center; gap: 8px; }
    input[type=range] { width: 150px; }
    pre { background: #0c111c; border-radius: 6px; padding: 10px 12px; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; margin: 8px 0 0; min-height: 1.5em; }
    .small { font-size: 12px; color: #8795b3; }
  </style>
</head>
<body>
  <main></main>
  <script type="module" src="src/music/jukebox.js"></script>
</body>
</html>
